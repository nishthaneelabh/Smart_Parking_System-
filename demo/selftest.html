<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SmartPark demo — engine self-test</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; background: #f4f8fb; }
  .pass { color: #0a7a3a; } .fail { color: #c0182b; font-weight: 600; }
  #summary { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
</style>
</head>
<body>
<h1>Demo engine self-test</h1>
<p>Checks the in-browser engine against the same expected values as the PostgreSQL test suite (pytest).</p>
<div id="summary">running…</div>
<ol id="out"></ol>
<script src="js/util.js"></script>
<script src="js/engine.js"></script>
<script src="js/seed.js"></script>
<script>
(function () {
  const { HOUR, MIN, istMidnight, parseLocal } = SPU;
  const E = SPDB, DB = E.DB;
  const results = [];
  function test(name, fn) {
    SPSEED.seed();
    try { fn(); results.push([true, name]); }
    catch (e) { results.push([false, name + " — " + (e && e.message)]); }
  }
  function eq(a, b, msg) { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`${msg || ""} expected ${JSON.stringify(b)} got ${JSON.stringify(a)}`); }
  function ok(c, msg) { if (!c) throw new Error(msg || "assertion failed"); }
  function throwsCode(fn, code) {
    try { fn(); } catch (e) { if (e.code === code) return; throw new Error(`expected ${code}, got ${e.code}: ${e.message}`); }
    throw new Error(`expected ${code}, nothing thrown`);
  }
  const day = (d, h, m = 0) => new Date(istMidnight(d).getTime() + h * HOUR + m * MIN);   // IST d days from today
  const t2030 = (dd, h, m = 0) => parseLocal(`2030-01-${String(dd).padStart(2, "0")}T${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`);
  const sid = (loc, code) => DB.slots.find((s) => s.location_id === loc && s.slot_code === code).slot_id;

  test("seed counts match seed.sql", () => {
    eq([DB.users.length, DB.vehicles.length, DB.locations.length, DB.slots.length, DB.chargers.length,
        DB.reservations.length, DB.waitingList.length, DB.payments.length, DB.maintenance.length],
       [14, 15, 6, 40, 16, 19, 4, 19, 3]);
  });
  test("seed fines: #2 ₹160, #3 ₹0, #4 ₹240", () => {
    eq([2, 3, 4].map((id) => E.reservation(id).overstay_fine), [160, 0, 240]);
    eq(E.finalBill(4).balance_due, 240);
  });
  test("seed occupancy: A01 and Palladium E01 occupied", () => {
    eq(DB.slots.filter((s) => s.occupancy_status === "OCCUPIED").map((s) => s.slot_id).sort((a, b) => a - b), [1, 39]);
  });
  test("seed queue order Arjun(3) > Meera(1) > Divya(1)", () => {
    const q = E.waitingQueue().filter((w) => w.status === "WAITING").sort((a, b) => a.queue_position - b.queue_position);
    eq(q.map((w) => w.user_id), [6, 3, 11]);
  });
  // T12
  [[9, 13, 9, 15, 80, 0], [9, 17, 9, 19, 120, 120], [9, 16, 9, 18, 100, 60], [9, 9, 9, 10, 60, 60],
   [12, 9, 12, 10, 40, 0], [12, 12, 12, 14, 100, 120]].forEach(([d1, h1, d2, h2, total, peak]) =>
    test(`T12 price Jan ${d1} ${h1}:00–${h2}:00 = ₹${total}`, () => {
      const p = E.calculatePrice(1, "REGULAR", null, t2030(d1, h1), t2030(d2, h2));
      eq([p.parking_fee, p.peak_minutes], [total, peak]);
    }));
  test("T12 45 minutes pro-rata = ₹30", () => eq(E.calculatePrice(1, "REGULAR", null, t2030(9, 13), t2030(9, 13, 45)).total, 30));
  // T13
  test("T13 AC ₹200, DC ₹380, DC peak ₹570, VIT 40+80, Mumbai 160+360", () => {
    eq(E.calculatePrice(1, "EV", "AC", t2030(9, 13), t2030(9, 15)).total, 200);
    eq(E.calculatePrice(1, "EV", "DC", t2030(9, 13), t2030(9, 15)).total, 380);
    eq(E.calculatePrice(1, "EV", "DC", t2030(9, 18), t2030(9, 20)).total, 570);
    const vit = E.calculatePrice(4, "EV", "AC", t2030(9, 13), t2030(9, 15));
    eq([vit.parking_fee, vit.charging_fee], [40, 80]);
    const mum = E.calculatePrice(6, "EV", "DC", t2030(9, 13), t2030(9, 15));
    eq([mum.parking_fee, mum.charging_fee], [160, 360]);
  });
  // T03
  test("T03 search: Nexon EV at location 1 → A05, E01, E02, E03", () => {
    const rows = E.searchSlots({ start: day(2, 10), end: day(2, 12), locationId: 1, vehicleId: 1 });
    eq(rows.map((r) => r.slot_code).sort(), ["A05", "E01", "E02", "E03"]);
    const all = E.searchSlots({ start: day(2, 10), end: day(2, 12) });
    ok(!all.some((r) => [sid(4, "E02"), sid(5, "E03")].includes(r.slot_id)), "faulty chargers listed");
  });
  // T04 / T07 / T08
  test("T04 booking HELD → pay → CONFIRMED; slot still FREE", () => {
    const id = E.createReservation(2, 1, 8, day(2, 12), day(2, 14));
    eq(E.reservation(id).status, "HELD");
    E.makePayment(id, 2, "UPI");
    eq(E.reservation(id).status, "CONFIRMED");
    eq(E.slot(8).occupancy_status, "FREE");
  });
  test("T07 overlaps rejected (5 cases)", () => {
    E.createReservation(2, 2, 5, day(3, 10), day(3, 12));
    [[11, 13], [9, 11], [10, 12], [10.5, 11.5], [9, 13]].forEach(([a, b]) =>
      throwsCode(() => E.createReservation(4, 4, 5, day(3, 0, a * 60), day(3, 0, b * 60)), "SLOT_UNAVAILABLE"));
  });
  test("T08 back-to-back allowed; same vehicle twice refused", () => {
    E.createReservation(2, 2, 5, day(3, 10), day(3, 12));
    E.createReservation(4, 4, 5, day(3, 12), day(3, 14));
    E.createReservation(3, 15, 5, day(3, 8), day(3, 10));
    throwsCode(() => E.createReservation(2, 2, sid(2, "B03"), day(3, 11), day(3, 13)), "VEHICLE_ALREADY_BOOKED");
  });
  test("invalid inputs give the right codes", () => {
    throwsCode(() => E.createReservation(2, 2, 5, day(-1, 10), day(-1, 12)), "INVALID_TIME");
    throwsCode(() => E.createReservation(2, 4, 5, day(2, 10), day(2, 12)), "VEHICLE_NOT_OWNED");
    throwsCode(() => E.createReservation(2, 2, sid(1, "E01"), day(2, 10), day(2, 12)), "VEHICLE_INCOMPATIBLE");
    throwsCode(() => E.createReservation(6, 6, 1, day(2, 10), day(2, 12)), "VEHICLE_INCOMPATIBLE");
  });
  // T09
  test("T09 cancel refunds and frees the slot", () => {
    const id = E.createReservation(2, 2, 5, day(3, 10), day(3, 12));
    E.makePayment(id, 2, "CARD");
    throwsCode(() => E.cancelReservation(id, 4), "RESERVATION_NOT_FOUND");
    ok(E.cancelReservation(id, 2) > 0, "refund");
    eq(E.reservation(id).status, "CANCELLED");
    E.createReservation(4, 4, 5, day(3, 10), day(3, 12));
    throwsCode(() => E.cancelReservation(id, 2), "CANNOT_CANCEL");
  });
  // T10 / T11
  test("T10 hold expiry + idempotent job; seed hold #19 expires", () => {
    const id = E.createReservation(2, 2, 5, day(2, 10), day(2, 12));
    E.reservation(id).hold_expires_at = new Date(Date.now() - 1000);
    throwsCode(() => E.makePayment(id, 2, "UPI"), "HOLD_EXPIRED");
    ok(E.runExpiryJobs().expired_holds >= 1);
    eq(E.runExpiryJobs().expired_holds, 0);
    eq([E.reservation(id).status, E.reservation(19).status], ["EXPIRED", "EXPIRED"]);
  });
  test("T11 expired hold no longer blocks", () => {
    const id = E.createReservation(2, 2, 5, day(2, 10), day(2, 12));
    throwsCode(() => E.createReservation(4, 4, 5, day(2, 10), day(2, 12)), "SLOT_UNAVAILABLE");
    E.reservation(id).hold_expires_at = new Date(Date.now() - 1000);
    E.createReservation(4, 4, 5, day(2, 10), day(2, 12));
    eq(E.reservation(id).status, "EXPIRED");
  });
  // T14 + trigger B
  [[-20, 0], [10, 0], [15, 0], [16, 80], [70, 160], [150, 240]].forEach(([late, fine]) =>
    test(`T14 ${late} min late → fine ₹${fine}`, () => {
      const t = new Date();
      const id = E.createReservation(2, 2, 5, t, new Date(t.getTime() + HOUR));
      E.makePayment(id, 2, "UPI"); E.checkIn(id, 2);
      eq(E.slot(5).occupancy_status, "OCCUPIED");
      const bill = E.checkOut(id, 1, true, new Date(E.reservation(id).end_time.getTime() + late * MIN));
      eq([bill.overstay_fine, bill.balance_due], [fine, fine]);
      eq(E.slot(5).occupancy_status, "FREE");
    }));
  // T15–T17
  test("T15 join / duplicate / slots-available / petrol-for-EV", () => {
    const r = E.reservation(14);
    const id = E.joinWaitingList(13, 13, 3, "EV", "DC", r.start_time, r.end_time);
    eq(E.entry(id).priority, 1);
    throwsCode(() => E.joinWaitingList(13, 13, 3, "EV", "DC", r.start_time, r.end_time), "ALREADY_WAITING");
    throwsCode(() => E.joinWaitingList(13, 13, 1, "EV", null, day(3, 10), day(3, 12)), "SLOTS_AVAILABLE");
    throwsCode(() => E.joinWaitingList(2, 2, 3, "EV", "DC", r.start_time, r.end_time), "VEHICLE_INCOMPATIBLE");
  });
  test("T16 premium Rohan joins last but goes 2nd", () => {
    const r = E.reservation(14);
    E.joinWaitingList(2, 1, 3, "EV", "DC", r.start_time, r.end_time);
    const q = E.waitingQueue().filter((w) => w.status === "WAITING").sort((a, b) => a.queue_position - b.queue_position);
    eq(q.map((w) => w.user_id), [6, 2, 3, 11]);
  });
  test("T17 cancel → Arjun offered → expires → Meera offered → pays → accepted", () => {
    E.cancelReservation(15, 5);
    const a = DB.waitingList.find((w) => w.user_id === 6);
    eq(a.status, "OFFERED");
    E.reservation(a.offered_reservation_id).hold_expires_at = new Date(Date.now() - 1000);
    eq(E.runExpiryJobs().offers_made, 1);
    eq(a.status, "EXPIRED");
    const m = DB.waitingList.find((w) => w.user_id === 3);
    eq(m.status, "OFFERED");
    E.makePayment(m.offered_reservation_id, 3, "UPI");
    eq([m.status, E.reservation(m.offered_reservation_id).status], ["ACCEPTED", "CONFIRMED"]);
  });
  // T18 / T19
  test("T18 + T19 faulty charger cancels, requeues (p4), blocks; repair re-offers", () => {
    const id = E.createReservation(13, 13, 8, day(2, 12), day(2, 14));
    E.makePayment(id, 13, "UPI");
    E.markChargerFaulty(3, "Connector melted", 1);
    eq(E.reservation(id).status, "CANCELLED");
    eq(DB.payments.find((p) => p.reservation_id === id).status, "REFUNDED");
    const w = DB.waitingList.find((x) => x.user_id === 13 && x.status === "WAITING");
    eq([w.priority, w.charger_type, w.location_id], [4, "DC", 1]);
    throwsCode(() => E.createReservation(14, 14, 8, day(3, 12), day(3, 14)), "CHARGER_FAULTY");
    E.markChargerRepaired(3, "Breaker replaced");
    eq(w.status, "OFFERED");
    eq(E.reservation(w.offered_reservation_id).slot_id, 8);
    E.createReservation(14, 14, 8, day(3, 12), day(3, 14));
  });
  test("audit records HELD → CONFIRMED", () => {
    const id = E.createReservation(2, 2, 5, day(2, 10), day(2, 12));
    E.makePayment(id, 2, "UPI");
    eq(DB.audit.filter((a) => a.table_name === "reservations" && a.record_id === id).map((a) => [a.old_status, a.new_status]),
       [[null, "HELD"], ["HELD", "CONFIRMED"]]);
  });
  test("register validates and refuses duplicates; vehicle with bookings cannot be deleted", () => {
    E.register({ full_name: "Test Driver", email: "Test@Example.in", phone: "9123456780", password: "Secret123",
                 vehicle: { registration_no: "tn 05 xy 4321", vehicle_type: "SUV", model_name: "Nexon", is_ev: true, connector_type: "CCS2" } });
    eq(DB.vehicles[DB.vehicles.length - 1].registration_no, "TN05XY4321");
    throwsCode(() => E.register({ full_name: "X Y", email: "test@example.in", phone: "9123456781", password: "Secret123" }), "DUPLICATE");
    throwsCode(() => E.deleteVehicle(2, 1), "INVALID_REFERENCE");
  });

  const failed = results.filter((r) => !r[0]).length;
  document.getElementById("summary").textContent = failed ? `${failed} FAILED / ${results.length}` : `ALL ${results.length} PASSED`;
  document.getElementById("summary").className = failed ? "fail" : "pass";
  document.getElementById("out").innerHTML = results.map(([p, n]) => `<li class="${p ? "pass" : "fail"}">${p ? "PASS" : "FAIL"} — ${SPU.esc(n)}</li>`).join("");
  document.title = failed ? "FAILED" : "PASSED";
})();
</script>
</body>
</html>
