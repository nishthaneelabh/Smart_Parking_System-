{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="sp-card p-5 text-center mx-auto sp-fade-in" style="max-width: 560px">
    <div class="display-4 fw-bold text-primary mb-2">{{ code }}</div>
    <h1 class="h4 fw-bold">{{ title }}</h1>
    <p class="sp-muted">{{ message }}</p>
    <a href="{{ url_for('auth.index') }}" class="btn btn-primary">Go home</a>
    <a href="javascript:history.back()" class="btn btn-outline-secondary">Go back</a>
  </div>
</div>
{% endblock %}
